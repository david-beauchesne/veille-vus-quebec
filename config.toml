[app]
database = "data/vehicles.sqlite3"
dashboard = "output/index.html"
timezone = "America/Toronto"
disappeared_after_days = 7

[search]
min_year = 2020
max_year = 2023
preferred_price_min = 20000
preferred_price_max = 25000
absolute_price_max = 30000
ideal_mileage_max = 100000
acceptable_mileage_max = 110000
home_keywords = ["quebec", "québec", "levis", "lévis", "beauport", "charlesbourg", "sainte-foy"]
montreal_keywords = ["montreal", "montréal", "laval", "longueuil", "brossard"]
primary_models = ["Mazda CX-5", "Honda CR-V", "Toyota RAV4", "Toyota RAV4 Hybrid", "Subaru Forester"]
secondary_models = ["Subaru Outback", "Toyota Venza Hybrid", "Volkswagen Tiguan"]

# Donnees structurees Schema.org publiees par Occasion Beaucage. Son robots.txt
# autorise actuellement l'indexation; le collecteur le reverifie avant chaque lot.
[[sources]]
name = "occasion-beaucage"
type = "jsonld"
enabled = true
urls = [
  "https://www.occasionbeaucage.com/auto-usage/mazda/cx-5/",
  "https://www.occasionbeaucage.com/auto-usage/honda/cr-v/",
  "https://www.occasionbeaucage.com/auto-usage/toyota/rav4/",
  "https://www.occasionbeaucage.com/auto-usage/subaru/forester/",
  "https://www.occasionbeaucage.com/auto-usage/subaru/outback/",
  "https://www.occasionbeaucage.com/auto-usage/toyota/venza/",
  "https://www.occasionbeaucage.com/auto-usage/volkswagen/tiguan/"
]
default_location = "Québec (province)"

[[sources]]
name = "mazda-chatel"
type = "jsonld"
enabled = true
url = "https://www.mazdachatel.com/occasion/Mazda-CX_5.html?nfr=1"
default_location = "Québec"

[[sources]]
name = "honda-de-la-capitale"
type = "jsonld"
enabled = true
url = "https://www.hondadelacapitale.com/occasion/HONDA-CR_V.html"
default_location = "Québec"

[[sources]]
name = "levis-toyota"
type = "jsonld"
enabled = true
url = "https://www.levistoyota.ca/occasion/Toyota-Rav4.html?nfr=1"
default_location = "Lévis"

[[sources]]
name = "levis-subaru"
type = "jsonld"
enabled = true
url = "https://www.levissubaru.com/occasion/recherche.html"
default_location = "Lévis"

[[sources]]
name = "desjardins-subaru"
type = "jsonld"
enabled = true
url = "https://www.desjardinssubaru.com/auto-usage/"
default_location = "Québec"

[weights.long_term]
reliability = 0.22
mechanical_simplicity = 0.12
maintenance_cost = 0.12
