name: Veille quotidienne
on:
  schedule:
    - cron: "17 11 * * *" # 7 h 17 à Québec pendant l'heure avancée
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python -m veille_vus.cli collect
      - name: Conserver la base et le dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vehicles.sqlite3 output/index.html
          git diff --cached --quiet || git commit -m "chore: mise à jour quotidienne"
          git push
      - name: Préparer la page
        uses: actions/upload-pages-artifact@v5
        with:
          path: output
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
