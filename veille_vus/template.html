<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veille VUS Québec</title><style>
:root{--ink:#17221d;--muted:#637068;--paper:#f4f2eb;--card:#fff;--green:#1f6648;--gold:#cf8a26;--line:#d9ddd7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px system-ui,sans-serif}header{padding:32px max(4vw,24px) 22px;background:#173d31;color:white}h1{margin:0;font-size:clamp(28px,4vw,46px)}header p{margin:8px 0 0;color:#c8d8d0}.wrap{padding:22px max(4vw,24px)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}.stat,.filters{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{display:block;font-size:26px}.stat span{color:var(--muted)}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input,select{padding:9px;border:1px solid var(--line);border-radius:8px;background:white}table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#e8ece8;font-size:12px;text-transform:uppercase}td.title{white-space:normal;min-width:260px}.score{font-weight:800;color:var(--green)}.pill{padding:4px 8px;border-radius:20px;background:#e4eee9}.drop{color:#a24d13;font-weight:700}a{color:var(--green)}.empty{text-align:center;padding:40px;color:var(--muted)}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.tablebox{overflow:auto}}
</style></head><body><header><h1>Veille VUS Québec</h1><p>Décisions sobres, historique complet · Mis à jour __GENERATED__</p></header><main class="wrap"><section class="stats" id="stats"></section><section class="filters"><select id="view"><option value="">Toutes les annonces</option><option value="top">Top 10 actives vérifiées</option><option value="new">Nouvelles du jour</option><option value="drops">Baisses de prix</option><option value="home">Québec / Lévis</option><option value="montreal">Montréal — déplacement</option></select><input id="q" placeholder="Recherche…"><select id="status"><option value="">Tous les statuts</option></select><select id="model"><option value="">Tous les modèles</option></select><select id="location"><option value="">Tous les lieux</option></select><input id="minyear" type="number" placeholder="Année min"><input id="maxyear" type="number" placeholder="Année max"><input id="maxprice" type="number" placeholder="Prix max"><input id="maxkm" type="number" placeholder="Km max"><input id="minscore" type="number" step="0.1" placeholder="Score min"></section><div class="tablebox"><table><thead><tr><th>Annonce</th><th>Prix</th><th>Km</th><th>Lieu</th><th>Confiance</th><th>Long terme</th><th>4–6 ans</th><th>Global</th><th>Statut</th><th>Observée</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
const all=__DATA__; const $=id=>document.getElementById(id), today=new Date().toISOString().slice(0,10);
const uniq=k=>[...new Set(all.map(x=>x[k]).filter(Boolean))].sort();
for(const s of uniq('recommendation')) $('status').add(new Option(s,s)); for(const s of uniq('model')) $('model').add(new Option(s,s)); for(const s of uniq('location')) $('location').add(new Option(s,s));
function fresh(x){return x.first_seen.slice(0,10)===today} function dropped(x){return x.max_price&&x.price<x.max_price}
function render(){let a=all.filter(x=>(!$('q').value||(`${x.make} ${x.model} ${x.location}`).toLowerCase().includes($('q').value.toLowerCase()))&&(!$('status').value||x.recommendation===$('status').value)&&(!$('model').value||x.model===$('model').value)&&(!$('location').value||x.location===$('location').value)&&(!$('minyear').value||x.year>=+$('minyear').value)&&(!$('maxyear').value||x.year<=+$('maxyear').value)&&(!$('maxprice').value||x.price<=+$('maxprice').value)&&(!$('maxkm').value||x.mileage<=+$('maxkm').value)&&(!$('minscore').value||x.overall_score>=+$('minscore').value));let v=$('view').value;if(v==='top')a=a.filter(x=>x.status==='active'&&x.verification_status==='verified'&&x.in_scope).slice(0,10);if(v==='new')a=a.filter(fresh);if(v==='drops')a=a.filter(dropped);if(v==='home')a=a.filter(x=>/(québec|quebec|lévis|levis)/i.test(x.location||''));if(v==='montreal')a=a.filter(x=>/montréal|montreal|laval|longueuil|brossard/i.test(x.location||'')&&x.overall_score>=8);
$('stats').innerHTML=[['Actives',all.filter(x=>x.status==='active').length],['Nouvelles',all.filter(fresh).length],['Baisses',all.filter(dropped).length],['À contacter',all.filter(x=>x.recommendation==='À contacter').length],['Montréal exceptionnel',all.filter(x=>/montr/i.test(x.location||'')&&x.overall_score>=8).length]].map(x=>`<div class=stat><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');
$('rows').innerHTML=a.map(x=>`<tr><td class=title>${fresh(x)?'<span class=pill>Nouveau</span> ':''}<a href="${x.url}" target=_blank rel=noopener>${x.year||'—'} ${x.make||''} ${x.model||x.title||'Annonce'}</a><br><small>${x.source}</small></td><td>${x.price?x.price.toLocaleString('fr-CA')+' $':'—'} ${dropped(x)?`<span class=drop>↓ ${(x.max_price-x.price).toLocaleString('fr-CA')}$</span>`:''}</td><td>${x.mileage?x.mileage.toLocaleString('fr-CA'):'—'}</td><td>${x.location||'—'}</td><td><span class=pill title="${x.verification_error||''}">${x.verification_status==='verified'?'Vérifiée':'À vérifier'}</span></td><td class=score>${x.long_term_score??'—'}</td><td class=score>${x.four_six_year_score??'—'}</td><td class=score>${x.overall_score??'—'}</td><td><span class=pill>${x.recommendation}</span></td><td>${x.first_seen.slice(0,10)}</td></tr>`).join('')||'<tr><td colspan=10 class=empty>Aucune annonce ne correspond aux filtres.</td></tr>'}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',render));render();</script></body></html>
